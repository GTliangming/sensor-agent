<!-- index.html：整个单页应用（SPA）的宿主页面，浏览器真正加载的第一个文件 -->
<!-- React 不会直接生成这个页面，而是把渲染结果挂载到下方 id=root 的节点里 -->
<!doctype html>
<!-- lang="zh-CN" 声明页面主语言为简体中文，利于无障碍与搜索引擎 -->
<html lang="zh-CN">
  <head>
    <!-- 字符编码设为 UTF-8，保证中文等多字节字符正确显示 -->
    <meta charset="UTF-8" />
    <!-- viewport：适配移动端，使页面按设备宽度缩放 -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- theme-color：部分浏览器据此给地址栏/状态栏着色 -->
    <meta name="theme-color" content="#111827" />
    <!-- 浏览器标签页上显示的标题 -->
    <title>语音标注智能体工作台</title>
  </head>
  <body>
    <!-- 这个空 div 就是 React 的挂载根节点，对应 main.jsx 中的 getElementById('root') -->
    <div id="root"></div>
    <!-- 以 ES Module 方式加载应用入口脚本，由 Vite 负责解析与打包 -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
