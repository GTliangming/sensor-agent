name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (渲染测试需要)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy, 非阻塞)
        run: mypy app || true
      - name: Tests
        env:
          TEXT_PROVIDER: fake
          IMAGE_PROVIDER: fake
          TTS_PROVIDER: fake
          VIDEO_GEN_PROVIDER: fake
        run: pytest -q
