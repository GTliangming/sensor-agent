[project]
name = "speech-mark-agent"
version = "0.1.0"
description = "语音标注业务 Agent 服务（学习与开发骨架）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.158.1",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "langchain==1.2.18",
  "langchain-core>=1.2,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "httpx>=0.28,<1.0",
  "structlog>=25.0,<27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
