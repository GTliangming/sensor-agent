# 仓库根目录的 Render Blueprint；免费版不挂载持久磁盘。
services:
  - type: web
    name: sensor-agent-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: FLASK_DEBUG
        value: "0"
      - key: CORS_ORIGINS
        value: https://gtliangming.github.io
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: EMBEDDING_DIM
        value: "1024"
