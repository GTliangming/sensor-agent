<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ============================================================
   基础环境
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0e1526, 120, 240);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 400);
camera.position.set(40, 27, 46);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2.0, 2.6, 0.6);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.screenSpacePanning = true;
controls.minDistance = 20;
controls.maxDistance = 110;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.485;
controls.zoomSpeed = 0.9;
controls.rotateSpeed = 0.8;

/* 后期：辉光 */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.46, 0.6, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const vignette = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, strength: { value: 0.45 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float strength; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 p = (vUv - 0.5) * vec2(1.0, 0.86);
      float v = smoothstep(0.82, 0.28, length(p));
      float lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      vec3 col = mix(vec3(lum), c.rgb, 1.22);          // 饱和度
      col = (col - 0.5) * 1.05 + 0.5;                   // 对比
      col += vec3(-0.012, 0.0, 0.035) * (1.0 - lum);    // 阴影偏冷
      col += vec3(0.015, 0.006, 0.0) * smoothstep(0.45, 1.0, lum); // 高光偏暖
      c.rgb = col * mix(1.0, v, strength);
      gl_FragColor = vec4(clamp(c.rgb, 0.0, 1.0), c.a);
    }`,
});
composer.addPass(vignette);

/* ============================================================
   工具函数
   ============================================================ */
function makeGradient() {
  const data = new Uint8Array([86, 148, 202, 255]);
  const t = new THREE.DataTexture(data, data.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const GRAD = makeGradient();

const toon = (color, opts = {}) => new THREE.MeshToonMaterial({ color, gradientMap: GRAD, ...opts });
const basic = (color, opts = {}) => new THREE.MeshBasicMaterial({ color, ...opts });

const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: 0x11141f, side: THREE.BackSide, fog: false });
function withOutline(mesh, k = 1.02) {
  const o = new THREE.Mesh(mesh.geometry, OUTLINE_MAT);
  o.scale.setScalar(k);
  o.castShadow = false;
  o.receiveShadow = false;
  mesh.add(o);
  return mesh;
}

function mkBox(w, h, d, material, x = 0, y = 0, z = 0, outlineK = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  if (outlineK) withOutline(m, outlineK);
  return m;
}

function tubeBetween(a, b, r, material, segs = 6) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, segs), material);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true;
  return m;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const JP_FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","PingFang SC",sans-serif';

/* 地面纹理 */
function asphaltTexture() {
  return canvasTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#23273a';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 5200; i++) {
      const g = 30 + Math.random() * 34;
      ctx.fillStyle = `rgba(${g + 12},${g + 16},${g + 30},${0.25 + Math.random() * 0.4})`;
      const s = Math.random() * 2.4 + 0.4;
      ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
    }
    // 淡淡的裂纹
    ctx.strokeStyle = 'rgba(18,20,30,0.35)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      let x = Math.random() * w, y = Math.random() * h;
      ctx.moveTo(x, y);
      for (let j = 0; j < 5; j++) {
        x += (Math.random() - 0.5) * 90;
        y += (Math.random() - 0.5) * 90;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  });
}

function tileTexture(base, line, cells = 8) {
  return canvasTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);
    const step = w / cells;
    ctx.strokeStyle = line;
    ctx.lineWidth = 2.2;
    for (let i = 1; i < cells; i++) {
      ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(w, i * step); ctx.stroke();
    }
    // 细微污渍
    for (let i = 0; i < 220; i++) {
      ctx.fillStyle = `rgba(20,22,34,${Math.random() * 0.09})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 7 + 1, 0, 7);
      ctx.fill();
    }
  });
}

function floorTileTexture() {
  return canvasTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#c3b294';
    ctx.fillRect(0, 0, w, h);
    const step = w / 8;
    ctx.strokeStyle = 'rgba(150,138,118,0.8)';
    ctx.lineWidth = 2;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(w, i * step); ctx.stroke();
    }
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 3, 3);
    }
  });
}

/* ============================================================
   组装动画时间线
   ============================================================ */
const timeline = [];
function assemble(obj, delay, opts = {}) {
  const it = {
    obj,
    delay,
    dur: opts.dur ?? 0.95,
    mode: opts.mode || 'rise',
    h: opts.h ?? 3.5,
    y0: obj.position.y,
    s0: obj.scale.clone(),
    done: false,
  };
  obj.visible = false;
  timeline.push(it);
  return obj;
}

const lightFades = [];
function fadeLight(light, target, delay, dur = 0.9) {
  light.intensity = 0;
  lightFades.push({ light, target, delay, dur });
  return light;
}

const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);
const easeOutBack = (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2);
const smooth = (p) => p * p * (3 - 2 * p);

let clockStart = performance.now() / 1000;
function timelineTime() { return performance.now() / 1000 - clockStart; }

function updateAssembly(t) {
  for (const it of timeline) {
    const p = (t - it.delay) / it.dur;
    if (p <= 0) { it.obj.visible = false; continue; }
    it.obj.visible = true;
    if (p >= 1) {
      if (!it.done) {
        it.obj.position.y = it.y0;
        it.obj.scale.copy(it.s0);
        it.done = true;
      }
      continue;
    }
    const e = easeOutCubic(p);
    if (it.mode === 'grow') {
      const s = Math.max(0.001, easeOutBack(p));
      it.obj.scale.copy(it.s0).multiplyScalar(s);
    } else {
      it.obj.position.y = it.y0 - it.h * (1 - e);
      const s = 0.9 + 0.1 * e;
      it.obj.scale.copy(it.s0).multiplyScalar(s);
    }
  }
  for (const f of lightFades) {
    const p = Math.max(0, Math.min(1, (t - f.delay) / f.dur));
    f.light.intensity = f.target * smooth(p);
  }
}

  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new THREE.Color(0x05060d) },
    mid: { value: new THREE.Color(0x101a33) },
    bottom: { value: new THREE.Color(0x1b2745) },
  },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; varying vec3 vP;
    void main(){
      float h = normalize(vP).y;
      vec3 c = mix(bottom, mid, smoothstep(-0.05, 0.35, h));
      c = mix(c, top, smoothstep(0.3, 0.85, h));
      gl_FragColor = vec4(c, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(170, 32, 16), skyMat);
scene.add(sky);
scene.background = null;

const world = new THREE.Group();
scene.add(world);

const SW = 0.34; // 人行道表面高度

assemble(baseGroup, 0, { mode: 'grow', dur: 1.15 });

const slab = mkBox(44, 1.8, 44, toon(0x171a26), 0, -0.9, 0, 1.012);

// 路面
const asphaltMap = asphaltTexture();
asphaltMap.wrapS = asphaltMap.wrapT = THREE.RepeatWrapping;
asphaltMap.repeat.set(9, 9);
const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(44, 44), toon(0xffffff, { map: asphaltMap }));
asphalt.rotation.x = -Math.PI / 2;
asphalt.position.y = 0.012;
asphalt.receiveShadow = true;
baseGroup.add(asphalt);

/* ---------------- 人行道 ---------------- */
const sidewalkTex = tileTexture('#6f7387', '#565b6e');
const sidewalkMatFactory = () => toon(0xffffff, { map: sidewalkTex.clone() });

function addSidewalk(w, d, x, z) {
  const tex = sidewalkTex.clone();
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(w / 2.4, d / 2.4);
  tex.needsUpdate = true;
  const m = mkBox(w, 0.34, d, toon(0xffffff, { map: tex }), x, 0.17, z);
  baseGroup.add(m);
  return m;
}

addSidewalk(34, 3, 5, 5.5);      // 店前

function curb(w, d, x, z) {

}

function stockRow(parent, { x0, x1, y, z, size = 0.22, gap = 0.05, palette, tall = 1 }) {
  const count = Math.max(1, Math.floor((x1 - x0) / (size + gap)));
  const geo = new THREE.BoxGeometry(size, size * tall, size * 0.82);
  const im = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }), count);
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  for (let i = 0; i < count; i++) {
    dummy.position.set(x0 + size / 2 + i * (size + gap), y + (size * tall) / 2, z + (Math.random() - 0.5) * 0.05);
    dummy.rotation.set(0, (Math.random() - 0.5) * 0.2, 0);
    dummy.scale.set(1, 0.86 + Math.random() * 0.3, 1);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    im.setColorAt(i, col.set(palette[(Math.random() * palette.length) | 0]));
  }
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  parent.add(im);
  return im;
}

function gondola(cx, cz, len, delay) {
  const g = new THREE.Group();
  g.position.set(cx, 0.4, cz);
  store.add(g);
  const shelfMat = toon(0xd6cab3);
  const frameMat = toon(0x8b93a5);
  g.add(mkBox(len, 0.12, 1.55, frameMat, 0, 0.08, 0));
  g.add(mkBox(len, 0.1, 1.55, shelfMat, 0, 0.95, 0));
  g.add(mkBox(len, 0.1, 1.55, shelfMat, 0, 1.45, 0));
  g.add(mkBox(0.09, 1.6, 1.55, frameMat, -len / 2 + 0.05, 0.8, 0));
  g.add(mkBox(0.09, 1.6, 1.55, frameMat, len / 2 - 0.05, 0.8, 0));
  g.add(mkBox(len - 0.1, 0.5, 0.06, toon(0xf3ecdd), 0, 1.2, 0));
  // 商品：前后两侧各一排
  for (let zSide = -1; zSide <= 1; zSide += 2) {
    stockRow(g, { x0: -len / 2 + 0.2, x1: len / 2 - 0.2, y: 1.46, z: zSide * 0.52, size: 0.23, gap: 0.05, palette: snackPalette, tall: 1.3 });
    stockRow(g, { x0: -len / 2 + 0.2, x1: len / 2 - 0.2, y: 1.0, z: zSide * 0.5, size: 0.26, gap: 0.05, palette: snackPalette, tall: 1.1 });
    stockRow(g, { x0: -len / 2 + 0.2, x1: len / 2 - 0.2, y: 0.16, z: zSide * 0.5, size: 0.28, gap: 0.06, palette: snackPalette, tall: 1.6 });
  }
  // 端头 POP 牌
  const pop = mkBox(0.06, 0.5, 0.4, basic(0xffd166), len / 2 - 0.02, 1.75, 0.5);
  g.add(pop);
  assemble(g, delay, { h: 2.6, dur: 0.85 });
  return g;
}

function vendingFrontTexture(theme) {
  return canvasTex(256, 512, (ctx, w, h) => {
    ctx.fillStyle = '#0c1220';
    ctx.fillRect(0, 0, w, h);
    // 顶部灯箱
    const g = ctx.createLinearGradient(0, 0, 0, 96);
    g.addColorStop(0, theme.header1);
    g.addColorStop(1, theme.header2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, 96);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText(theme.brand, 22, 62);
    // 商品格
    const cols = 4, rows = 4;
    const cw = (w - 36) / cols, ch = 78;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = 14 + c * cw, y = 112 + r * 92;
        ctx.fillStyle = 'rgba(255,255,255,0.09)';
        ctx.fillRect(x + 4, y + 6, cw - 12, ch);
        const col = theme.cans[(r * cols + c) % theme.cans.length];
        ctx.fillStyle = col;
        ctx.fillRect(x + cw / 2 - 17, y + 12, 34, 54);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillRect(x + cw / 2 - 17, y + 24, 34, 8);
        ctx.fillStyle = '#ffd166';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('¥150', x + cw / 2 - 16, y + 76);
        ctx.fillStyle = '#7ef0ff';
        ctx.fillRect(x + cw / 2 - 12, y + 84, 24, 6);
      }
    }
    // 底部
    ctx.fillStyle = '#1b2438';
    ctx.fillRect(0, h - 78, w, 78);
    ctx.fillStyle = '#4de0ff';
    ctx.fillRect(24, h - 56, 60, 28);
    ctx.fillStyle = '#0c1220';
    ctx.fillRect(30, h - 50, 48, 16);
  });
}

function bicycle(x, z, rotY, color) {
  const g = new THREE.Group();
  g.position.set(x, SW, z);
  g.rotation.y = rotY;
  const frameMat = toon(color);
  const tireMat = toon(0x23262f);
  const chrome = toon(0xaeb6c6);
  const wheelGeo = new THREE.TorusGeometry(0.36, 0.035, 6, 22);
  const wheelPositions = [-0.62, 0.62];
  for (const wx of wheelPositions) {
    const wheel = new THREE.Mesh(wheelGeo, tireMat);
    wheel.position.set(wx, 0.36, 0);
    wheel.castShadow = true;
    g.add(wheel);
    for (let i = 0; i < 5; i++) {
      const spoke = mkBox(0.6, 0.012, 0.012, chrome, wx, 0.36, 0);
      spoke.rotation.z = (i / 5) * Math.PI;
      spoke.castShadow = false;
      g.add(spoke);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.06, 8), chrome);
    hub.rotation.x = Math.PI / 2;
    hub.position.set(wx, 0.36, 0);
    g.add(hub);
  }
  const P = (x, y) => new THREE.Vector3(x, y, 0);
  const tubes = [
    [P(-0.62, 0.36), P(-0.06, 0.72)],
    [P(-0.06, 0.72), P(0.30, 0.75)],
    [P(0.30, 0.75), P(0.62, 0.36)],
    [P(-0.62, 0.36), P(0.02, 0.48)],
    [P(0.02, 0.48), P(0.30, 0.75)],
    [P(0.02, 0.48), P(-0.06, 0.72)],
    [P(0.62, 0.36), P(0.52, 0.92)],
  ];
  for (const [a, b] of tubes) g.add(tubeBetween(a, b, 0.028, frameMat));
  // 车把
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.42, 6), chrome);
  bar.position.set(0.5, 1.0, 0);
  bar.rotation.x = Math.PI / 2;
  g.add(bar);
  g.add(tubeBetween(P(0.52, 0.92), P(0.5, 1.0), 0.024, chrome));
  // 车座
  g.add(tubeBetween(P(-0.06, 0.72), P(-0.1, 0.95), 0.024, chrome));
  const saddle = mkBox(0.28, 0.06, 0.16, toon(0x2c303c), -0.1, 0.98, 0);
  g.add(saddle);
  // 车筐
  g.add(mkBox(0.34, 0.26, 0.3, toon(0x8b93a5), 0.58, 1.02, 0));
  // 挡泥板
  const fender = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.03, 4, 12, Math.PI), toon(color));
  fender.position.set(0.62, 0.36, 0);
  fender.rotation.z = 0.2;
  g.add(fender);
  // 脚撑
  g.add(tubeBetween(P(0.0, 0.4), P(-0.2, 0.0), 0.02, chrome));
  g.rotation.z = -0.06;
  world.add(g);
  return g;
}

  // 横担
  for (const [hy, len] of [[height - 0.6, 1.7], [height - 1.4, 1.35]]) {
    const arm = mkBox(len, 0.09, 0.09, toon(0x6b6a68), 0, hy, 0);

    for (const ox of [-len / 2 + 0.12, 0, len / 2 - 0.12]) {
      const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 0.14, 8), toon(0xd8dbe2));
      ins.position.set(ox, hy + 0.11, 0);
      g.add(ins);

  // 变压器
  const trans = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.7, 10), toon(0x777d8c));
  trans.position.set(0.36, height - 2.1, 0);
  trans.castShadow = true;

  for (let i = 0; i < 7; i++) {

    r.castShadow = false;
    g.add(r);
  }
  world.add(g);
  return g;
}

  const geo = new THREE.TubeGeometry(curve, 24, radius, 4, false);

  m.castShadow = false;
  world.add(m);
  return m;
}

function railRun(x0, z0, x1, z1) {
  const len = Math.hypot(x1 - x0, z1 - z0);
  const n = Math.max(2, Math.round(len / 1.7));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = x0 + (x1 - x0) * t;
    const z = z0 + (z1 - z0) * t;
    const post = mkBox(0.1, 0.95, 0.1, railPostMat, x, 0.47, z);
    railing.add(post);
  }
  for (const y of [0.42, 0.86]) {
    const bar = mkBox(len, 0.07, 0.07, railMat, (x0 + x1) / 2, y, (z0 + z1) / 2);
    bar.rotation.y = Math.atan2(-(z1 - z0), x1 - x0);
    railing.add(bar);
  }
}

// 霓虹 / 灯光的湿地反光条
function glowStreak(x, z, w, d, color, opacity = 0.3, rot = 0, y = 0.05) {
  const tex = canvasTex(256, 256, (ctx, cw, ch) => {
    ctx.clearRect(0, 0, cw, ch);
    const g = ctx.createRadialGradient(cw / 2, ch / 2, 4, cw / 2, ch / 2, cw * 0.46);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.28, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.62, 'rgba(255,255,255,0.16)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cw, ch);
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({
    map: tex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  m.rotation.x = -Math.PI / 2;
  m.rotation.z = rot;
  m.position.set(x, y, z);
  m.renderOrder = 2;
  world.add(m);
  assemble(m, 2.0, { mode: 'grow', dur: 0.9 });
  return m;
}

const rainGeo = new THREE.BufferGeometry();

const rainDrops = [];
for (let i = 0; i < RAIN_COUNT; i++) {
  const x = -23 + Math.random() * 46;

  const o = i * 6;

  rainPos[o + 3] = x + 0.07; rainPos[o + 4] = y + len; rainPos[o + 5] = z;
}

/* ============================================================
   相机入场
   ============================================================ */
const camFrom = new THREE.Vector3(32, 22, 40);
const camTo = new THREE.Vector3(19, 13, 33);
let introT = 0;
let introDone = false;
controls.addEventListener('start', () => { introDone = true; });


/* ============================================================
   循环
   ============================================================ */
const clock = new THREE.Clock();
let rainFade = 0;

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = timelineTime();

  // 组装
  updateAssembly(t);

  // 相机入场
  if (!introDone) {
    introT += dt;
    const k = Math.min(introT / 5.2, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(camFrom, camTo, e);
    if (k >= 1) introDone = true;
  }

  // 雨
  rainFade = Math.min(1, Math.max(0, (t - 3.7) / 1.4));
  rainMatLine.opacity = rainFade * 0.3;
  if (rainFade > 0) {
    const arr = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_COUNT; i++) {
      const d = rainDrops[i];
      d.y -= d.speed * dt;
      if (d.y < -0.5) {
        d.y = 22 + Math.random() * 6;
        d.x = -23 + Math.random() * 46;
        d.z = -23 + Math.random() * 46;
      }
      const o = i * 6;
      arr[o] = d.x + (d.y * 0.02);
      arr[o + 1] = d.y;
      arr[o + 2] = d.z;
      arr[o + 3] = d.x + 0.07 + (d.y * 0.02);
      arr[o + 4] = d.y + d.len;
      arr[o + 5] = d.z;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  // 涟漪
  if (t > 3.9) {
    for (const r of ripples) {
      r.t += dt;
      if (r.t > r.dur) { resetRipple(r); }
      const p = r.t / r.dur;
      if (p > 1) { r.mesh.visible = false; continue; }
      r.mesh.visible = true;
      const s = 0.15 + p * 1.6;
      r.mesh.scale.set(s, s, s);
      r.mesh.material.opacity = (1 - p) * 0.45;
    }
  }

  // 微小环境漂浮：霓虹轻微呼吸
  if (t > 3.5) {
    const breathe = 0.9 + Math.sin(t * 2.1) * 0.06;
    neonLight.intensity = 7 * breathe;
    signLight.intensity = 9 * (0.96 + Math.sin(t * 1.7 + 1.0) * 0.04);
  }

  controls.update();
  composer.render();
}

renderer.setAnimationLoop(animate);
